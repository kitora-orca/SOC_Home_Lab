title: Windows Defender Real-Time Protection Modification via PowerShell
id: 3f2e0d2b-7d3e-4d1d-9a2d-6f4e6c3b8a11
status: work
description: Detects PowerShell or PowerShell Core execution of Set-MpPreference with the DisableRealtimeMonitoring parameter.
author: kitora-orca
date: 2026-09-06

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_command:
    CommandLine|contains|all:
      - 'Set-MpPreference'
      - '-DisableRealtimeMonitoring'

  condition: selection_image and selection_command

falsepositives:
  - Legitimate administrative
  - Authorized security testing
  - Temporary Microsoft Defender configuration changes

level: high

tags:
  - T1562.001 - Impair Defenses: Disable or Modify Tools
